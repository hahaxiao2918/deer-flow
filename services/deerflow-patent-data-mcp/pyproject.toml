[project]
name = "deerflow-patent-data-mcp"
version = "0.1.0"
description = "Cost-governed patent data MCP for Deerflow"
requires-python = ">=3.11"
dependencies = [
  "fastmcp==3.4.2",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/deerflow_patent_data_mcp"]
